<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="nmstyle.css" />
  </head>
  <body>
    <div class="min-h-screen grid place-items-center px-6">
      <div class="w-full max-w-sm" data-tsd-source="/src/routes/login.tsx:31:7">
        <a
          href="/nm-solutions-all-in-one (1).html"
          class="block text-center text-sm font-semibold tracking-tight mb-10"
          >NM SOLUTIONS</a
        >
        <h1 class="text-2xl text-center font-semibold tracking-tight">
          Welcome back
        </h1>
        <p class="text-sm text-center text-muted-foreground mt-1">
          Log in to your workspace.
        </p>
        <form class="mt-8 space-y-4">
          <button
            type="button"
            class="w-full flex items-center justify-center gap-2 rounded-md bg-card ring-1 ring-border py-2 text-sm font-medium hover:ring-brand disabled:opacity-50"
          >
            <svg class="size-4" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              ></path>
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"
              ></path>
              <path
                fill="#FBBC05"
                d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.1V7.07H2.18A11 11 0 0 0 1 12c0 1.77.43 3.45 1.18 4.93l3.66-2.83z"
              ></path>
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.83C6.71 7.31 9.14 5.38 12 5.38z"
              ></path></svg
            >Continue with Google
          </button>
          <div class="flex items-center gap-3 text-xs text-muted-foreground">
            <div class="h-px flex-1 bg-border"></div>
            OR
            <div class="h-px flex-1 bg-border"></div>
          </div>
          <div>
            <label
              class="text-xs font-medium uppercase tracking-wider text-muted-foreground"
              >Email</label
            ><input
              type="email"
              required=""
              class="mt-1 w-full rounded-md bg-card ring-1 ring-border px-3 py-2 text-sm focus:ring-brand outline-none"
              value=""
            />
          </div>
          <div>
            <label
              class="text-xs font-medium uppercase tracking-wider text-muted-foreground"
              >Password</label
            ><input
              type="password"
              required=""
              class="mt-1 w-full rounded-md bg-card ring-1 ring-border px-3 py-2 text-sm focus:ring-brand outline-none"
              value=""
            />
          </div>
          <button
            class="w-full rounded-md bg-brand text-background py-2 text-sm font-medium disabled:opacity-50"
          >
            Sign in
          </button>
        </form>
        <p class="mt-6 text-center text-sm text-muted-foreground">
          No account?
          <a href="/signup-page.html" class="text-brand hover:underline"
            >Create one</a
          >
        </p>
      </div>
    </div>
    <!--/$-->
    <section
      aria-label="Notifications alt+T"
      tabindex="-1"
      aria-live="polite"
      aria-relevant="additions text"
      aria-atomic="false"
    ></section>
  </body>
</html>
